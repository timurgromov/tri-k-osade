name: Check the published game and cabinet

on:
  push:
    branches: [main]
    paths:
      - 'phaser/**'
      - '.github/workflows/check-pages-cabinet.yml'
      - '.github/scripts/check-pages-cabinet.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: check-pages-cabinet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Wait for this commit on Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            if build=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '[.commit,.status] | join(" ")'); then
              if [[ "$build" == "$GITHUB_SHA built" ]]; then
                exit 0
              fi
              if [[ "$build" == "$GITHUB_SHA errored" ]]; then
                echo "::error::Pages could not publish $GITHUB_SHA"
                exit 1
              fi
            fi
            sleep 10
          done
          echo "::error::Pages did not confirm publication of $GITHUB_SHA"
          exit 1
      - name: Check the game, cabinet and Sorceress card in Chrome
        run: |
          npm install --ignore-scripts --no-package-lock --no-save --prefix "$RUNNER_TEMP/pages-cabinet" playwright@1.61.1
          NODE_PATH="$RUNNER_TEMP/pages-cabinet/node_modules" node .github/scripts/check-pages-cabinet.cjs
